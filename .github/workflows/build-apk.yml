name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Agar project zip file ki shakal mein upload hua hai, to use khol do
      - name: Unzip project (if uploaded as zip)
        run: |
          for z in *.zip; do
            [ -e "$z" ] || continue
            echo "Unzipping $z"
            unzip -q -o "$z"
          done

      # Gradle project kis folder mein hai, ye khud dhundh lo
      - name: Find project folder
        run: |
          SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle nahi mila. Project ya uski zip file repo mein upload karo."
            ls -R | head -50
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "Project folder: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle ka version fix karna zaroori hai (runner ka apna Gradle naya/alag ho sakta hai)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartPhoneControl-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
